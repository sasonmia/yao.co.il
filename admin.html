<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yuli – Users admin</title>
<style>
  [hidden]{display:none!important}
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f6f7fb;color:#1f2937}
  header{background:#1f2937;color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
  main{padding:20px;max-width:1100px;margin:0 auto}
  input,button,select{font:inherit}
  input[type=password]{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;min-width:240px}
  button{padding:7px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
  button.sec{background:#e5e7eb;color:#111}
  button.bad{background:#dc2626}
  button.ok{background:#16a34a}
  table{border-collapse:collapse;width:100%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:14px;white-space:nowrap}
  th{background:#eef2ff;cursor:pointer;user-select:none}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
  .yes{color:#166534;font-weight:600}.no{color:#6b7280}
  #msg{margin:10px 0;color:#b91c1c;min-height:1.2em}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<header><strong>Yuli – Users admin</strong><span id="count"></span></header>
<main>
  <div id="login" class="tools">
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
    <button id="go">Sign in</button>
  </div>
  <div id="msg"></div>
  <div id="app" hidden>
    <div class="tools">
      <label>Status <select id="f-status"><option value="">all</option><option>pending</option><option>approved</option><option>rejected</option></select></label>
      <label><input type="checkbox" id="f-active"> active only</label>
      <button class="sec" id="refresh">Refresh</button>
      <button class="sec" id="signout">Sign out</button>
    </div>
    <div class="scroll"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p style="color:#6b7280;font-size:13px">active = logged in during the last 30 days. freeAccess = free (no payment) access.</p>
  </div>
</main>
<script>
const COLS=[['username','username'],['status','status'],['active','active'],['freeAccess','freeAccess'],['totalStars','totalStars'],['created','created'],['lastLogin','lastLogin'],['actions','actions']];
let KEY='',USERS=[],sortBy='created',sortDir=-1;
const $=id=>document.getElementById(id);
const fmt=t=>t?new Date(t).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'–';
async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json','X-Admin-Key':KEY}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'error'),{status:r.status});
  return j;
}
async function load(){
  $('msg').textContent='';
  try{USERS=(await api('/admin/users')).users;$('login').hidden=true;$('app').hidden=false;render()}
  catch(e){$('msg').textContent=e.status===401?'Wrong admin key.':'Could not load users.';$('app').hidden=true;$('login').hidden=false}
}
function render(){
  $('head').innerHTML='';
  COLS.forEach(([k,l])=>{const th=document.createElement('th');th.textContent=l+(sortBy===k?(sortDir>0?' ▲':' ▼'):'');
    if(k!=='actions')th.onclick=()=>{sortDir=sortBy===k?-sortDir:1;sortBy=k;render()};$('head').appendChild(th)});
  const fs=$('f-status').value,fa=$('f-active').checked;
  let rows=USERS.filter(u=>(!fs||u.status===fs)&&(!fa||u.active));
  rows.sort((a,b)=>{const x=a[sortBy],y=b[sortBy];return (x>y?1:x<y?-1:0)*sortDir});
  $('count').textContent=`${USERS.length} users · ${USERS.filter(u=>u.active).length} active · ${USERS.filter(u=>u.status==='pending').length} pending`;
  const tb=$('rows');tb.innerHTML='';
  rows.forEach(u=>{
    const tr=document.createElement('tr');
    const td=(c,t)=>{const e=document.createElement('td');if(c)e.className=c;e.textContent=t;tr.appendChild(e);return e};
    td('',u.username);
    const s=td('','');const pill=document.createElement('span');pill.className='pill '+u.status;pill.textContent=u.status;s.appendChild(pill);
    td(u.active?'yes':'no',u.active?'true':'false');
    td(u.freeAccess?'yes':'no',u.freeAccess?'true':'false');
    td('',String(u.totalStars));
    td('',fmt(u.created));td('',fmt(u.lastLogin));
    const act=td('','');
    const b=(t,cls,fn)=>{const x=document.createElement('button');x.textContent=t;x.className=cls;x.style.marginRight='6px';x.onclick=fn;act.appendChild(x)};
    if(u.status!=='approved')b('Approve','ok',()=>upd(u,{status:'approved',freeAccess:true}));
    if(u.status!=='rejected')b('Reject','bad',()=>upd(u,{status:'rejected'}));
    b(u.freeAccess?'Remove free':'Give free','sec',()=>upd(u,{freeAccess:!u.freeAccess}));
    tb.appendChild(tr);
  });
}
async function upd(u,patch){
  try{const r=await api('/admin/user',{method:'PUT',body:JSON.stringify({username:u.username,...patch})});Object.assign(u,r);render()}
  catch(e){$('msg').textContent='Update failed.'}
}
$('go').onclick=()=>{KEY=$('key').value.trim();if(KEY)load()};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('refresh').onclick=load;
$('signout').onclick=()=>{KEY='';$('key').value='';$('app').hidden=true;$('login').hidden=false};
$('f-status').onchange=render;$('f-active').onchange=render;
</script>
</body>
</html>
