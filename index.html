<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuli</title>
<meta name="description" content="יולי הינשוף: תרגול אנגלית ודיבור – 200 מילים, דקדוק ראשון ושיחה.">
<meta name="theme-color" content="#14B8A6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦉%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#FFF8E7;--ink:#1F2A44;--teal:#14B8A6;--teal-d:#0E8F82;--sun:#FFB020;--coral:#FF6B6B;--line:#EADFC6;--ok:#22A559;--bad:#E5484D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Segoe UI','Arial Hebrew',Arial,system-ui,sans-serif;font-size:18px;line-height:1.45}
.en{font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:flex-end;gap:12px;padding:12px 16px 4px;max-width:780px;margin:0 auto}
#owlwrap{width:92px;flex:none}
#owl{width:100%;display:block}
#owl .beak{transform-box:fill-box;transform-origin:50% 0}
#owl.talking .beak{animation:beak .28s infinite alternate}
#owl.talking{animation:bob .6s infinite alternate}
@keyframes beak{to{transform:scaleY(.55)}}
@keyframes bob{to{transform:translateY(-4px)}}
#bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 16px;flex:1;min-height:66px;box-shadow:0 4px 0 var(--ink);margin-bottom:8px}
#bubble::before{content:'';position:absolute;right:-11px;bottom:22px;width:18px;height:18px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg)}
#bubble .en{font-size:21px;font-weight:600;color:var(--teal-d);margin-top:2px}
.spk{border:0;background:none;font-size:20px;padding:0 4px}
main{max-width:780px;margin:0 auto;padding:8px 16px 48px}
.nav{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;gap:8px}
.crumb{font-weight:700}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700}
.btn{background:var(--teal);color:#fff;border:0;border-radius:16px;padding:12px 22px;font-weight:700;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #C98300;color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.hero{display:grid;gap:12px}
.big-card{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px;text-align:start;box-shadow:0 5px 0 var(--ink);width:100%}
.big-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big-card .ic{font-size:38px;width:56px;text-align:center}
.big-card b{display:block;font-size:20px}
.big-card small{color:#5b6684}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile-btn{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;font-weight:500}
.tile-btn:hover{border-color:var(--teal)}
.tile-btn .ic{font-size:34px;display:block}
.tile-btn .st{font-size:15px;letter-spacing:1px;min-height:22px}
.prog{text-align:center;font-weight:700;color:#5b6684;margin-bottom:8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:20px;text-align:center;box-shadow:0 5px 0 var(--ink)}
.card .emo{font-size:96px;line-height:1.1}
.card .word{font-size:46px;font-weight:600}
.card .he{font-size:24px;color:#5b6684;margin-bottom:12px}
.qp{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;text-align:center;margin-bottom:14px;font-size:22px}
.qp .emo{font-size:64px;display:block}
.qp .gap{display:inline-block;min-width:70px;border-bottom:4px solid var(--sun)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.wrap{display:flex;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 8px;font-size:26px;font-weight:600;box-shadow:0 4px 0 var(--ink);font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,sans-serif}
.opt.emoji{font-size:54px;padding:8px}
.opt.ok{background:#CFF3DC;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:#FFD9DA;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{text-align:center;min-height:30px;margin-top:12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 6px;font-size:28px;min-height:64px;box-shadow:0 4px 0 var(--ink);font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.tile.sel{background:#FFF0C7;border-color:var(--sun)}
.tile.done{background:#CFF3DC;border-color:var(--ok);box-shadow:none;opacity:.55;pointer-events:none}
.tile.flip{background:var(--teal);color:#fff;font-size:34px}
.tile.back{background:var(--ink);color:#fff}
.tile.shake{animation:shake .3s}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memgrid .tile{font-size:24px;padding:8px 2px;min-height:78px}
.slots,.ans,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;padding:8px}
.slots,.ans{background:#fff;border:3px dashed var(--line);border-radius:16px;margin-bottom:14px}
.ltr{background:#fff;border:3px solid var(--ink);border-radius:12px;min-width:48px;padding:8px 10px;font-size:28px;font-weight:600;box-shadow:0 3px 0 var(--ink);font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;text-align:center}
.ltr.w{font-size:22px}
.ltr.in{background:#FFF0C7}
.pool .ltr[draggable=true]{cursor:grab}
.chat{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.b{max-width:82%;padding:8px 14px;border-radius:16px;font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:20px}
.b.bot{background:#E4F7F4;align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:#FFF0C7;align-self:flex-end;border-bottom-right-radius:4px}
.inrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.inrow input,.text{flex:1;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:22px;font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;min-width:0;background:#fff}
.mic{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--coral);font-size:26px;box-shadow:0 4px 0 var(--ink);flex:none}
.mic.on{animation:pulse .9s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,107,107,.35)}}
.lesson{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--ink)}
.lesson h3{margin:.2em 0 .4em}
.ex{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#E4F7F4;border-radius:12px;padding:8px 12px;margin:6px 0}
.ex .en{font-size:22px;font-weight:600}
.ex span.h{color:#5b6684;font-size:16px}
.sw{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;border:3px solid #1F2A44;vertical-align:middle}
.tile .sw{width:44px;height:44px}.opt.emoji .sw{width:56px;height:56px}.card .emo .sw{width:96px;height:96px}.qp .emo .sw{width:64px;height:64px}
.stars-big{font-size:56px;text-align:center;letter-spacing:6px}
.note{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:15px;color:#5b6684;margin-top:18px}
a.big-card{text-decoration:none;color:inherit}
.nameform{display:flex;gap:8px;margin-top:12px}
.bar{height:10px;background:#F0E6CC;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal)}
@media(max-width:480px){#owlwrap{width:70px}.card .emo{font-size:80px}.memgrid .tile{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div class="top">
  <div id="owlwrap">
    <svg id="owl" viewBox="0 0 120 124" role="img" aria-label="Yuli the owl">
      <polygon points="26,40 30,10 54,30" fill="#F29A00"/><polygon points="94,40 90,10 66,30" fill="#F29A00"/>
      <ellipse cx="60" cy="74" rx="42" ry="44" fill="#FFB020"/>

      <circle cx="43" cy="56" r="17" fill="#fff" stroke="#1F2A44" stroke-width="3"/><circle cx="77" cy="56" r="17" fill="#fff" stroke="#1F2A44" stroke-width="3"/>

<main id="main"></main>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null)continue;
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isCol=e=>e&&e[0]==='#';
const visH=e=>isCol(e)?`<span class="sw" style="background:${e}"></span>`:e;
const vis=e=>isCol(e)?el('span',{class:'sw',style:'background:'+e}):document.createTextNode(e);
const starsStr=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const starsFrom=(g,t)=>{const r=g/t;return r>=.9?3:r>=.6?2:1};

/* ---------- storage ---------- */
let DB={users:{},last:''};
try{DB=Object.assign(DB,JSON.parse(localStorage.getItem('yuli_users')||'{}'))}catch(e){}
try{const old=JSON.parse(localStorage.getItem('ollie_g4')||'null');if(old&&old.name&&!DB.users[old.name])DB.users[old.name]={stars:old.stars||{}}}catch(e){}
let S={name:'',stars:{}};
const saveDB=()=>{try{localStorage.setItem('yuli_users',JSON.stringify(DB))}catch(e){}};
const save=()=>{if(S.name){DB.users[S.name]={stars:S.stars};DB.last=S.name}saveDB()};
function loginAs(n){
  n=(n||'').replace(/\s+/g,' ').trim().slice(0,20);if(!n)return;
  const ex=Object.keys(DB.users).find(k=>k.toLowerCase()===n.toLowerCase());if(ex)n=ex;
  S={name:n,stars:(DB.users[n]&&DB.users[n].stars)||{}};save();home();
}
function logout(){S={name:'',stars:{}};DB.last='';saveDB();loginScreen()}
const award=(k,n)=>{S.stars[k]=Math.max(S.stars[k]||0,n);save()};
const sum=pref=>Object.entries(S.stars).filter(([k])=>k.startsWith(pref)).reduce((a,[,v])=>a+v,0);

/* ---------- speech: tts + dictation ---------- */
let tts=null,dict=null,activeL=null;
(function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  let rec=null;const pCb=[],fCb=[],sCb=[];
  dict={
    onPartial:f=>pCb.push(f),onFinal:f=>fCb.push(f),onState:f=>sCb.push(f),
    start(){return new Promise((res,rej)=>{
      try{
        rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
        rec.onstart=()=>sCb.forEach(f=>f({state:'listening'}));
        rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;(e.results[i].isFinal?fCb:pCb).forEach(f=>f({text:t}))}};
        rec.onend=()=>sCb.forEach(f=>f({state:'idle'}));
        rec.onerror=e=>{sCb.forEach(f=>f({state:'idle',reason:e.error}));rej(e)};
        rec.start();res();
      }catch(err){rej(err)}
    })},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()}
  };
  dict.onPartial(e=>activeL&&activeL.partial&&activeL.partial(e.text));
  dict.onFinal(e=>activeL&&activeL.final&&activeL.final(e.text));
  dict.onState(e=>activeL&&activeL.state&&activeL.state(e.state));
})();
let talkTimer=null;
function owlTalk(text){const o=$('#owl');o.classList.add('talking');clearTimeout(talkTimer);talkTimer=setTimeout(()=>o.classList.remove('talking'),Math.min(6000,500+text.length*65))}
function speak(text,rate=.85,lang='en'){
  owlTalk(text);
  if(tts){tts.speak(text,{language:lang,rate}).catch(()=>{});return}
  if('speechSynthesis' in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='he'?'he-IL':'en-US';u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
}
function say(he,en,spokenHe){
  const b=$('#bubble');b.replaceChildren();
  if(he){b.append(el('div',{html:he}));if(spokenHe)speak(he.replace(/<[^>]+>/g,''),.95,'he')}
  if(en){b.append(el('div',{class:'en',dir:'ltr'},en,' ',el('button',{class:'spk','aria-label':'שמעו',onclick:()=>speak(en)},'🔊')));speak(en)}
}
function micButton(onFinal){
  if(!dict)return null;
  const b=el('button',{class:'mic',type:'button','aria-label':'דברו'},'🎤');
  b.onclick=()=>{
    if(b.classList.contains('on')){dict.stop().catch(()=>{});return}
    activeL={final:t=>onFinal(t),state:s=>b.classList.toggle('on',s==='listening')};
    dict.start().catch(()=>{});
  };
  return b;
}
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function heard(target,text){
  const tw=norm(target).split(' ').filter(Boolean),sw=norm(text).split(' ').filter(Boolean);
  if(!tw.length||!sw.length)return false;
  const hit=tw.filter(t=>sw.some(s=>lev(t,s)<=(t.length>=5?1:0))).length;
  return hit/tw.length>=.75;
}

/* ---------- views ---------- */
const main=$('#main');
function view(...nodes){main.replaceChildren(...nodes.filter(Boolean));window.scrollTo(0,0)}
function navBar(title,back,extra){return el('div',{class:'nav'},back?el('button',{class:'btn ghost',onclick:back},'→ חזרה'):el('span'),el('span',{class:'crumb'},title),extra||el('span'))}

/* ---------- DATA: 200 words, 20 chunks x 10 ---------- */
const CH=[
{t:'צבעים',i:'🎨',w:[['red','אדום','#E53935'],['blue','כחול','#1E66F5'],['green','ירוק','#2EAA4A'],['yellow','צהוב','#FFD21F'],['black','שחור','#1B1B1B'],['white','לבן','#FFFFFF'],['orange','כתום','#FF8A00'],['purple','סגול','#8E44AD'],['brown','חום','#8B5A2B'],['pink','ורוד','#FF7EB6']]},
{t:'מספרים',i:'🔢',w:[['one','אחד','1️⃣'],['two','שניים','2️⃣'],['three','שלוש','3️⃣'],['four','ארבע','4️⃣'],['five','חמש','5️⃣'],['six','שש','6️⃣'],['seven','שבע','7️⃣'],['eight','שמונה','8️⃣'],['nine','תשע','9️⃣'],['ten','עשר','🔟']]},
{t:'חיות',i:'🐶',w:[['cat','חתול','🐱'],['dog','כלב','🐶'],['bird','ציפור','🐦'],['fish','דג','🐟'],['horse','סוס','🐴'],['cow','פרה','🐮'],['duck','ברווז','🦆'],['rabbit','ארנב','🐰'],['monkey','קוף','🐵'],['lion','אריה','🦁']]},
{t:'משפחה',i:'👪',w:[['mother','אמא','👩'],['father','אבא','👨'],['brother','אח','👦'],['sister','אחות','👧'],['baby','תינוק','👶'],['grandma','סבתא','👵'],['grandpa','סבא','👴'],['friend','חבר','🧑‍🤝‍🧑'],['teacher','מורה','🧑‍🏫'],['family','משפחה','👪']]},
{t:'הגוף',i:'🖐️',w:[['hand','יד','✋'],['foot','כף רגל','🦶'],['eye','עין','👁️'],['ear','אוזן','👂'],['nose','אף','👃'],['mouth','פה','👄'],['hair','שיער','💇'],['leg','רגל','🦵'],['arm','זרוע','💪'],['tooth','שן','🦷']]},
{t:'אוכל',i:'🍎',w:[['apple','תפוח','🍎'],['banana','בננה','🍌'],['bread','לחם','🍞'],['cheese','גבינה','🧀'],['egg','ביצה','🥚'],['milk','חלב','🥛'],['pizza','פיצה','🍕'],['cake','עוגה','🍰'],['rice','אורז','🍚'],['water','מים','💧']]},
{t:'פירות וירקות',i:'🥕',w:[['tomato','עגבנייה','🍅'],['cucumber','מלפפון','🥒'],['carrot','גזר','🥕'],['potato','תפוח אדמה','🥔'],['grapes','ענבים','🍇'],['lemon','לימון','🍋'],['strawberry','תות','🍓'],['watermelon','אבטיח','🍉'],['pear','אגס','🍐'],['corn','תירס','🌽']]},
{t:'בית הספר',i:'🎒',w:[['book','ספר','📖'],['pen','עט','🖊️'],['pencil','עיפרון','✏️'],['bag','תיק','🎒'],['chair','כיסא','🪑'],['school','בית ספר','🏫'],['ruler','סרגל','📏'],['computer','מחשב','💻'],['scissors','מספריים','✂️'],['notebook','מחברת','📓']]},
{t:'הבית',i:'🏠',w:[['house','בית','🏠'],['door','דלת','🚪'],['window','חלון','🪟'],['bed','מיטה','🛏️'],['key','מפתח','🔑'],['phone','טלפון','📱'],['television','טלוויזיה','📺'],['sofa','ספה','🛋️'],['lamp','מנורה','💡'],['mirror','מראה','🪞']]},

/* ---------- generic quiz runner ---------- */
function mkq(prompt,opts,ans,extra={}){const idx=shuffle(opts.map((_,i)=>i));return Object.assign({prompt,opts:idx.map(i=>opts[i]),a:idx.indexOf(ans)},extra)}
function P(html,listen){const d=el('div',{class:'qp'});d.innerHTML=html;if(listen)d.append(el('div',{},el('button',{class:'btn sun',onclick:()=>speak(listen,.8)},'🔊 שמעו')));return d}
function runQuiz(c,qs,done){
  let i=0,good=0;
  const show=()=>{
    if(i>=qs.length)return done(good,qs.length);
    const q=qs[i];let first=true,locked=false;
    const fb=el('div',{class:'fb'});
    const opts=el('div',{class:'opts '+(q.cls||'')});
    q.opts.forEach((o,k)=>{
      const b=el('button',{class:'opt'+(q.emoji?' emoji':''),dir:'ltr',type:'button',onclick:()=>{
        if(locked)return;
        if(k===q.a){locked=true;b.classList.add('ok');if(first)good++;fb.textContent='✅ Great!';if(q.say)speak(q.say);setTimeout(()=>{i++;show()},900)}
        else{first=false;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');fb.textContent='🙂 לא נורא, נסו שוב'}
      }},o);
      opts.append(b);
    });
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${qs.length}`),q.prompt,opts,fb);
    if(q.listen)speak(q.listen,.8);
  };
  show();
}

/* ---------- word stations ---------- */
function stLearn(c,x){
  let i=0;
  const show=()=>{
    const [en,he,em]=x.words[i];
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${x.words.length}`),
      el('div',{class:'card'},el('div',{class:'emo'},vis(em)),el('div',{class:'en word',dir:'ltr'},en),el('div',{class:'he'},he),el('button',{class:'btn',onclick:()=>speak(en,.75)},'🔊 שמעו')),
      el('div',{class:'row'},
        el('button',{class:'btn ghost',disabled:i===0,onclick:()=>{i--;show()}},'→ הקודמת'),
        i<x.words.length-1?el('button',{class:'btn',onclick:()=>{i++;show()}},'הבאה ←'):el('button',{class:'btn sun',onclick:()=>x.finish(3)},'סיימתי! ⭐')));
    speak(en,.75);
  };
  show();
}
function stListen(c,x){
  const ws=shuffle(x.words);
  runQuiz(c,ws.map(w=>{const others=shuffle(x.words.filter(o=>o!==w)).slice(0,3);return mkq(P('מה שמעתם? בחרו את התמונה',w[0]),[w,...others].map(o=>vis(o[2])),0,{emoji:true,listen:w[0]})}),(g,t)=>x.finish(starsFrom(g,t)));
}
function stRead(c,x){
  const ws=shuffle(x.words);
  runQuiz(c,ws.map(w=>{const others=shuffle(x.words.filter(o=>o!==w)).slice(0,3);return mkq(P(`<span class="en" dir="ltr" style="font-size:44px;font-weight:600">${w[0]}</span>`),[w,...others].map(o=>vis(o[2])),0,{emoji:true,say:w[0]})}),(g,t)=>x.finish(starsFrom(g,t)));
}
function stMatch(c,x){
  const ws=shuffle(x.words).slice(0,6);let sel=null,left=6,miss=0;
  const mk=(w,t)=>{const b=el('button',{class:'tile',dir:'ltr',type:'button'},t==='w'?w[0]:vis(w[2]));if(t==='e'&&!x.he)b.style.fontSize='40px';if(t==='e'&&x.he){b.setAttribute('dir','rtl');b.style.fontSize='22px'}b.onclick=()=>pick(b,t,w);return b};
  function pick(b,t,w){
    if(b.classList.contains('done'))return;
    if(t==='w')speak(w[0]);
    if(!sel||sel.t===t){if(sel)sel.b.classList.remove('sel');sel={b,t,id:w[0]};b.classList.add('sel');return}
    if(sel.id===w[0]){b.classList.add('done');sel.b.classList.add('done');sel.b.classList.remove('sel');sel=null;if(--left===0)setTimeout(()=>x.finish(miss<=1?3:miss<=4?2:1),600)}
    else{miss++;[b,sel.b].forEach(n=>{n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')});sel.b.classList.remove('sel');sel=null}
  }
  c.replaceChildren(P('חברו כל מילה לתמונה שלה: לחצו על מילה ואז על התמונה'),el('div',{class:'tiles'},shuffle(ws).map(w=>mk(w,'w')),shuffle(ws).map(w=>mk(w,'e'))));
}
function stMemory(c,x){
  const ws=shuffle(x.words).slice(0,6);let open=[],moves=0,left=6,lock=false;
  const cards=shuffle(ws.flatMap(w=>[{w,t:'w'},{w,t:'e'}]));
  const grid=el('div',{class:'memgrid'});
  const info=el('div',{class:'prog'},'מהלכים: 0');
  cards.forEach(cd=>{
    const b=el('button',{class:'tile back',dir:'ltr',type:'button'},'?');
    b.onclick=()=>{
      if(lock||b.classList.contains('flip')||b.classList.contains('done'))return;
      b.classList.remove('back');b.classList.add('flip');b.replaceChildren(cd.t==='w'?cd.w[0]:vis(cd.w[2]));if(cd.t==='w')speak(cd.w[0]);
      open.push([b,cd]);
      if(open.length===2){
        moves++;info.textContent='מהלכים: '+moves;lock=true;
        const [[b1,c1],[b2,c2]]=open;
        if(c1.w===c2.w&&c1.t!==c2.t){b1.classList.add('done');b2.classList.add('done');open=[];lock=false;if(--left===0)setTimeout(()=>x.finish(moves<=9?3:moves<=14?2:1),600)}
        else setTimeout(()=>{[b1,b2].forEach(n=>{n.classList.remove('flip');n.classList.add('back');n.textContent='?'});open=[];lock=false},900);
      }
    };
    grid.append(b);
  });
  c.replaceChildren(P('מצאו זוגות: מילה + התמונה שלה'),info,grid);
}
function stScramble(c,x){
  const ws=shuffle(x.words).slice(0,5);let i=0,errs=0;
  const next=()=>{
    if(i>=ws.length)return x.finish(errs<=1?3:errs<=4?2:1);
    const [en,he,em]=ws[i];
    let tiles=shuffle([...en].map((ch,k)=>({ch,k})));
    if(tiles.length>1&&tiles.map(t=>t.ch).join('')===en)tiles.reverse();
    let ans=[];
    const ansBox=el('div',{class:'slots',dir:'ltr'}),pool=el('div',{class:'pool',dir:'ltr'}),fb=el('div',{class:'fb'});
    const draw=()=>{
      ansBox.replaceChildren(...ans.map(t=>el('button',{class:'ltr in',type:'button',onclick:()=>{ans=ans.filter(a=>a!==t);draw()}},t.ch)));
      pool.replaceChildren(...tiles.filter(t=>!ans.includes(t)).map(t=>el('button',{class:'ltr',type:'button',onclick:()=>{ans.push(t);draw();check()}},t.ch)));
    };
    const check=()=>{
      if(ans.length!==tiles.length)return;
      if(ans.map(t=>t.ch).join('')===en){fb.textContent='✅ '+en;speak(en);i++;setTimeout(next,1200)}
      else{errs++;fb.textContent='🙂 כמעט! נסו שוב';ansBox.classList.add('shake');setTimeout(()=>{ans=[];draw()},800)}
    };
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${ws.length}`),P(`<span class="emo">${visH(em)}</span>${he}`),ansBox,pool,fb,el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>speak(en,.75)},'🔊 רמז: שמעו')));
    draw();
  };
  next();
}
function stMissing(c,x){
  const ws=shuffle(x.words).slice(0,6);
  const abc='abcdefghijklmnopqrstuvwxyz';
  runQuiz(c,ws.map(w=>{
    const en=w[0],cand=[...en].map((ch,k)=>k).filter(k=>/[a-z]/i.test(en[k]));
    const k=cand[Math.floor(Math.random()*cand.length)],ch=en[k];
    const wrong=shuffle([...abc].filter(l=>l!==ch.toLowerCase())).slice(0,3);
    const shown=en.slice(0,k)+'<span class="gap">&nbsp;&nbsp;</span>'+en.slice(k+1);
    return mkq(P(`<span class="emo">${visH(w[2])}</span>${w[1]}<div class="en" dir="ltr" style="font-size:44px;font-weight:600;margin-top:6px">${shown}</div>`,en),[ch,...wrong.map(l=>ch===ch.toUpperCase()&&/[A-Z]/.test(ch)?l.toUpperCase():l)],0,{cls:'three',say:en});
  }),(g,t)=>x.finish(starsFrom(g,t)));
}
function stCopy(c,x){
  const ws=shuffle(x.words).slice(0,4);let i=0,errs=0;
  const next=()=>{
    if(i>=ws.length)return x.finish(errs<=1?3:errs<=3?2:1);
    const [en,he,em]=ws[i];
    const inp=el('input',{class:'text',type:'text',dir:'ltr',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'כתבו כאן…'});
    const fb=el('div',{class:'fb'});
    const go=()=>{
      const v=inp.value.trim();if(!v)return;
      if(v.toLowerCase()===en.toLowerCase()){fb.textContent='✅ Great!';speak(en);i++;setTimeout(next,1000)}
      else{errs++;fb.textContent='🙂 בדקו שוב את האותיות';inp.select()}
    };
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${ws.length}`),P(`<span class="emo">${visH(em)}</span>${he}<div class="en" dir="ltr" style="font-size:46px;font-weight:600;margin-top:6px">${en}</div>`,en),
      el('div',{class:'inrow'},inp,el('button',{class:'btn',onclick:go},'בדיקה')),fb);
    inp.focus();
  };
  next();
}
function stSay(c,x){
  const ws=shuffle(x.words).slice(0,5);let i=0,got=0;
  const next=()=>{
    if(i>=ws.length)return x.finish(got>=4?3:got>=2?2:1);
    const [en,he,em]=ws[i];
    const fb=el('div',{class:'fb'});
    let advanced=false;
    const adv=(ok)=>{if(advanced)return;advanced=true;if(ok)got++;i++;setTimeout(next,1300)};
    const onText=t=>{if(heard(en,t)){fb.textContent='🎉 מעולה! שמעתי: '+t;speak(en);adv(true)}else{fb.textContent='🙂 שמעתי: "'+t+'". נסו שוב אחרי ששומעים את המילה'}};
    const mic=micButton(onText);
    const controls=el('div',{class:'inrow',style:'justify-content:center'},el('button',{class:'btn sun',onclick:()=>speak(en,.7)},'🔊 שמעו'),mic);
    let extra=null;
    if(!mic){
      const inp=el('input',{class:'text',type:'text',dir:'ltr',placeholder:'אמרו בקול, ואז הקלידו…'});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')onText(inp.value)});
      extra=el('div',{},el('div',{class:'inrow'},inp,el('button',{class:'btn',onclick:()=>onText(inp.value)},'בדיקה')),el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>{fb.textContent='👏 יפה! אמרתם בקול';adv(true)}},'אמרתי את זה בקול ✓')));
    }
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${ws.length}`),P(`<span class="emo">${visH(em)}</span>${he}<div class="en" dir="ltr" style="font-size:${x.fs||46}px;font-weight:600;margin-top:6px">${en}</div>`),
      controls,extra||'',fb,el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>adv(false)},'דלגו')));
    speak(en,.75);
  };
  next();
}
function stPunct(c,x){
  const qs=[];
  const set=new Map(x.words.map(w=>[w[0].toLowerCase(),w]));
  x.sents.forEach(s=>{
    const mark=s.slice(-1),body=s.slice(0,-1);
    qs.push(mkq(P(`<span class="en" dir="ltr" style="font-size:30px">${body}<span class="gap">&nbsp;&nbsp;</span></span>`,s),['. נקודה','? סימן שאלה'],mark==='.'?0:1,{cls:'',say:s}));
    const toks=body.split(' ').map(t=>t.replace(/[^A-Za-z']/g,''));
    const k=toks.findIndex(t=>set.has(t.toLowerCase())||set.has(t.toLowerCase().replace(/s$/,'')));
    if(k>=0){const w=set.get(toks[k].toLowerCase())||set.get(toks[k].toLowerCase().replace(/s$/,''));
      qs.push(mkq(P(`<div class="en" dir="ltr" style="font-size:26px;margin-bottom:6px">${s}</div>לחצו על המילה: <b>${w[1]}</b> ${visH(w[2])}`,s),toks,k,{cls:'wrap'}));}
  });
  runQuiz(c,qs,(g,t)=>x.finish(starsFrom(g,t)));
}

/* ---------- Assembly & talk (shared by grammar) ---------- */
function runAssembly(c,items,done){
  let i=0,errs=0;
  const next=()=>{
    if(i>=items.length)return done(errs<=1?3:errs<=3?2:1);
    const it=items[i],target=it.s.split(' ');
    let tiles=shuffle(target.map((w,k)=>({w,k})));
    if(tiles.map(t=>t.w).join(' ')===it.s)tiles.reverse();
    let ans=[];
    const ansBox=el('div',{class:'ans',dir:'ltr'}),pool=el('div',{class:'pool',dir:'ltr'}),fb=el('div',{class:'fb'});
    ansBox.addEventListener('dragover',e=>e.preventDefault());
    ansBox.addEventListener('drop',e=>{e.preventDefault();const k=+e.dataTransfer.getData('text/plain');const t=tiles.find(t=>t.k===k);if(t&&!ans.includes(t)){ans.push(t);draw();check()}});
    const draw=()=>{
      ansBox.replaceChildren(...ans.map(t=>el('button',{class:'ltr w in',type:'button',onclick:()=>{ans=ans.filter(a=>a!==t);draw()}},t.w)));
      if(!ans.length)ansBox.append(el('span',{style:'color:#9aa3bb;font-family:Rubik',dir:'rtl'},'גררו או לחצו על המילים כדי לבנות את המשפט'));
      pool.replaceChildren(...tiles.filter(t=>!ans.includes(t)).map(t=>{const b=el('button',{class:'ltr w',type:'button',draggable:'true',onclick:()=>{ans.push(t);draw();check()}},t.w);b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(t.k)));return b}));
    };
    const check=()=>{
      if(ans.length!==tiles.length)return;
      if(ans.map(t=>t.w).join(' ')===it.s){fb.textContent='✅ '+it.s;speak(it.s);i++;setTimeout(next,1500)}
      else{errs++;fb.textContent='🙂 כמעט! נסו לסדר מחדש';setTimeout(()=>{ans=[];draw()},900)}
    };
    c.replaceChildren(el('div',{class:'prog'},`${i+1} / ${items.length}`),P(`בנו את המשפט:<br><b>${it.he}</b>`),ansBox,pool,fb);
    draw();
  };
  next();
}
function runTalk(c,items,done,fin='Great talking with you!'){
  let i=0,good=0,tries=0;
  const log=el('div',{class:'chat'});
  const inp=el('input',{type:'text',dir:'ltr',placeholder:'Type or speak in English…',autocomplete:'off'});
  const micSlot=el('span');
  const bub=(who,t)=>{log.append(el('div',{class:'b '+who,dir:'ltr'},t));log.scrollTop=log.scrollHeight};
  const botSays=(t)=>{bub('bot',t);speak(t)};
  const ask=()=>{
    if(i>=items.length){botSays(fin);return setTimeout(()=>done(good,items.length),1800)}
    tries=0;botSays(items[i].bot);
    const m=micButton(submit);micSlot.replaceChildren(m||'');
  };
  const submit=txt=>{
    txt=(txt||'').trim();if(!txt||i>=items.length)return;
    bub('me',txt);inp.value='';
    const it=items[i];
    const ok=it.ok?it.ok.test(txt):norm(txt).split(' ').filter(Boolean).length>=2;
    if(ok){if(tries===0)good++;i++;botSays(it.reply||'Great job!');setTimeout(ask,1700)}
    else{tries++;if(tries<2)botSays('Good try! Say: '+it.model);else{botSays('That is OK. We can say: '+it.model);i++;setTimeout(ask,2200)}}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit(inp.value)});
  c.replaceChildren(log,el('div',{class:'inrow'},micSlot,inp,el('button',{class:'btn',onclick:()=>submit(inp.value)},'שלח')),
    el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>speak(items[Math.min(i,items.length-1)].bot)},'🔊 שמעו שוב'),el('button',{class:'btn ghost',onclick:()=>{if(i<items.length){botSays('Try: '+items[i].model)}}},'💡 רמז'),el('button',{class:'btn ghost',onclick:()=>{i++;ask()}},'דלגו')));
  ask();
}

const gapSp='<span class="gap">&nbsp;&nbsp;</span>';
const bigW=t=>`<div class="en" dir="ltr" style="font-size:44px;font-weight:600;margin-top:6px">${t}</div>`;
function pVowel(c,x){
  const V='aeiou';
  runQuiz(c,shuffle(PV).slice(0,8).map(([en,he])=>{
    const pos=[...en].map((ch,k)=>V.includes(ch)?k:-1).filter(k=>k>=0);
    const k=pos[Math.floor(Math.random()*pos.length)];
    return mkq(P(`${he}${bigW(en.slice(0,k)+gapSp+en.slice(k+1))}`,en),[...V],V.indexOf(en[k]),{cls:'wrap',say:en});
  }),(g,t)=>x.finish(starsFrom(g,t)));
}
function pOdd(c,x){
  runQuiz(c,shuffle(ODD).map(([ws,a,h])=>mkq(P(`מי יוצא דופן?<br><small>${h}</small>`),ws,a,{say:ws[a]})),(g,t)=>x.finish(starsFrom(g,t)));
}
function pChSh(c,x){
  runQuiz(c,shuffle(CHSH).slice(0,8).map(([w,d,he])=>{const i=w.indexOf(d);return{prompt:P(`${he}${bigW(w.slice(0,i)+gapSp+w.slice(i+2))}`,w),opts:['ch','sh'],a:d==='ch'?0:1,say:w,cls:''}}),(g,t)=>x.finish(starsFrom(g,t)));
}
function pSound(c,x){
  runQuiz(c,shuffle(CHSH).slice(0,8).map(([w,d])=>({prompt:P('לחצו על 🔊 והקשיבו: איזה צליל יש במילה?',w),opts:['ch','sh'],a:d==='ch'?0:1,say:w,listen:w,cls:''})),(g,t)=>x.finish(starsFrom(g,t)));
}
function pSent(c,x){
  runQuiz(c,shuffle(SENTS6).map(([s,a])=>{
    const wrong=shuffle(BANK.filter(b=>b!==a)).slice(0,3);
    return mkq(P(`<span class="en" dir="ltr" style="font-size:26px">${s.replace('___',gapSp)}</span>`,s.replace('___',a)),[a,...wrong],0,{say:s.replace('___',a)});
  }),(g,t)=>x.finish(starsFrom(g,t)));
}
function pReadSt(key){
  return (c,x)=>{
    const T=TEXTS[key];
    const box=el('div',{class:'lesson',dir:'ltr'},el('h3',{class:'en'},T.title),T.lines.map(l=>el('div',{class:'ex'},el('span',{class:'en',dir:'ltr'},l),el('button',{class:'spk',onclick:()=>speak(l)},'🔊'))));
    const qd=el('div',{style:'margin-top:14px'});
    const row=el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>speak(T.lines.join(' '),.8)},'🔊 הקריאו לי את הקטע'),el('button',{class:'btn sun',onclick:()=>{row.remove();qd.append(el('div',{class:'prog'},T.head));const qq=el('div');qd.append(qq);runQuiz(qq,T.q.map(([q,o,a])=>mkq(P(`<span class="en" dir="ltr" style="font-size:24px">${q}</span>`,q),o,a,{say:o[a]})),(g,t)=>x.finish(starsFrom(g,t)));qd.scrollIntoView({behavior:'smooth'})}},'לשאלות ←'));
    c.replaceChildren(box,row,qd);
  };
}
function pAloud(c,x){
  const items=[...TEXTS.rest.lines.slice(0,3),...TEXTS.kit.lines.slice(0,1),TEXTS.kit.lines[2],TEXTS.kit.lines[5]].map(s=>[s,'','📖']);
